[project]
name = "rag-against-the-machine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fire>=0.7.1",
    "pydantic>=2.13.4",
    "rank-bm25>=0.2.2",
    "torch>=2.0",  # transformers backend for AutoModelForCausalLM
    "tqdm>=4.69.0",
    "transformers>=5.14.1",  # load Qwen/Qwen3-0.6B
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
]

# The subject's Makefile spec requires `mypy .` (project root), not
# `mypy src`. Run literally from `.` without this exclude and mypy walks
# into .venv/, data/raw/ (the vendored vLLM corpus), and materials/ (a
# second corpus copy) — none of it ours, and it breaks mypy's module
# resolution (duplicate module names across vLLM's own files). Restrict
# checking to this project's own source and tests.
[tool.mypy]
exclude = "^(\\.venv/|data/|materials/)"

# Python Fire does not publish type information, and types-tqdm is not a
# runtime dependency of this project. Ignore missing declarations only at
# these third-party boundaries; our own src package is still checked with
# every rule enabled by `mypy --strict`.
[[tool.mypy.overrides]]
module = ["fire", "rank_bm25", "tqdm", "tqdm.*"]
ignore_missing_imports = true

# This project only needs CPU inference (Qwen/Qwen3-0.6B). The default
# PyPI 'torch' wheel bundles the full CUDA/GPU stack (cuDNN, NCCL,
# cuSolver, several GB), which is unnecessary here and can exhaust disk
# space on small machines. Route 'torch' to PyTorch's CPU-only wheel
# index instead; every other dependency still resolves from PyPI.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Without this, `pytest` collects from the whole repository, including the
# vLLM corpus under data/raw/ (which has its own, unrelated test suite that
# fails to import here). Restrict collection to this project's own tests.
[tool.pytest.ini_options]
testpaths = ["tests"]
# `uv run pytest` does not add the project root to sys.path by itself
# (unlike `uv run python -m pytest`), so `from src... import ...` in the
# tests would otherwise fail with ModuleNotFoundError. This makes it explicit
# instead of relying on how pytest happens to be invoked.
pythonpath = ["."]
